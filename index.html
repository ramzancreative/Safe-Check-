
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeCheck - Stay Safe Online</title>
  <style>
    body {
      margin: 0;
      padding: 25px 16px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }
    main {
      max-width: 600px;
      margin: 30px auto;
      background: white;
      padding: 24px;
      border-radius: 18px;
      box-shadow: 0 5px 25px #0001;
    }
    h1 { color: #087f8c; }
    textarea {
      width: 100%;
      height: 140px;
      box-sizing: border-box;
      padding: 12px;
      margin: 12px 0;
      border: 1px solid #ccd5df;
      border-radius: 10px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #087f8c;
      color: white;
      font-size: 16px;
    }
    #result {
      margin-top: 18px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <h1>SafeCheck</h1>
    <p>Think Before You Trust.</p>
    <p>Paste a suspicious message below to check
    for common warning signs.</p>

    <textarea id="message"
      placeholder="Paste your message here..."></textarea>

    <button onclick="checkMessage()">
      Check Warning Signs
    </button>

    <div id="result" role="status"></div>

    <p><small>
      This basic demo is not an AI detector and
      cannot confirm whether a message is genuine.
    </small></p>
  </main>

  <script>
    function checkMessage() {
      const message =
        document.getElementById("message").value.trim();
      const result = document.getElementById("result");

      if (!message) {
        result.textContent = "Please enter a message first.";
        return;
      }

      const patterns = [
        /pay.*(fee|registration|deposit|advance)/i,
        /password|otp|verification code/i,
        /urgent|immediately|act now/i,
        /guaranteed.*(income|profit|job)/i
      ];

      const found = patterns.some(pattern =>
        pattern.test(message)
      );

      result.textContent = found
        ? "Warning: This message contains a possible risk signal. Verify the sender independently before paying or sharing sensitive information."
        : "No warning signal was detected by this basic demo. That does not mean the message is safe. Verify the sender and website independently.";
    }
  </script>
</body>
</html>
